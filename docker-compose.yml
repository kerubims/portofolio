services:
  portfolio-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio-web
    restart: always
    ports:
      - "9020:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/data-cms
      - UPLOADS_DIR=/app/uploads
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SESSION_SECRET=${SESSION_SECRET}
    volumes:
      - ./data-cms:/app/data-cms
      - ./uploads:/app/uploads
